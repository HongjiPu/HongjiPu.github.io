# --------------------------------------------------
#  BASIC SITE INFO
# --------------------------------------------------
title: Hongji Pu   # Main site title (appears in browser tab & RSS)
tagline: Adventurous · Aspirational · Analytical  # 大图上标题之上的那行小字
subtitle: Independent and profound thought defines what it means to be human.
description: Hongji Pu's Personal Website. Researcher，Quantitative，Analyst  # Strongly recommended for SEO & social cards

# TIP ── For local development you can comment out `url`
# and build with relative paths. In production you want this set.
url: https://HongjiPu.github.io

# --------------------------------------------------
#  AUTHOR / PROFILE DATA
# --------------------------------------------------
owner:
  name: Hongji Pu
  role: MSFE · UIUC          # shown under your name in the sidebar rail
  avatar: avatar.jpg        # 网站图标 / 分享缩略图
  bio_photo: avatar.jpg     # 侧栏和正文里的个人照片
  email: hongjip2@gmail.com
  hero_img: hero.jpg  # 直接写文件名，因为它就在主文件夹
  cv: /CV_Hongji_Pu.pdf     # 简历 PDF，放在站点根目录

  # Social networking links are used in author-bio sidebar. Update and remove as you like.
  twitter:
  github: HongjiPu
  linkedin:
  scholar: https://scholar.google.com/citations?user=XSemCI4AAAAJ
  researchgate:
  zhihu:
  xiaohongshu:
  instagram:
  bilibili:
  # lastfm:
  # tumblr:


# --------------------------------------------------
#  SEARCH-ENGINE VERIFICATION & ANALYTICS
# --------------------------------------------------
google_verify: ""
# google_analytics: ""  # 如果你以后注册了 Google Analytics，再把 ID 填到这里
# bing_verify: ""    # https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
# google_analytics: "G-XXXXXXX"                                 # GA-4 property ID


# --------------------------------------------------
#  TOP NAVIGATION BAR
#  `external: true` opens the link in a new tab.
# --------------------------------------------------
#  external: true  -> 在新标签页打开（外链、PDF 用）
#
#  注意：Academic 页 (/academic/) 和原来的 Hobbies 页现在不在导航里，
#  但文件仍在、网址仍可直接访问。想加回来在下面补一行即可。
links:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/
  - title: Projects
    url: /experiences/
  - title: Experience
    url: /hobbies/
  - title: CV
    url: /CV_Hongji_Pu.pdf
    external: true
  - title: 中文
    url: /cn/


# --------------------------------------------------
#  BUILD & RENDERING OPTIONS
# --------------------------------------------------
timezone: America/Chicago          # IANA time-zone ID (China/Beijing is invalid)
future: true                     # Render posts dated in the future
highlighter: rouge               # Code highlighter; Rouge is default in MM
# markdown: kramdown             # Jekyll default; uncomment to force
# pygments: true                 # Legacy option (Rouge supersedes this)


# --------------------------------------------------
#  PERMALINK STRUCTURE
# --------------------------------------------------
permalink: /:categories/:title    # e.g. /tech/my-post/


# --------------------------------------------------
#  KRAMDOWN (Markdown engine) SETTINGS
# --------------------------------------------------
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

  # coderay:
  #   coderay_line_numbers:
  #   coderay_line_numbers_start: 1
  #   coderay_tab_width: 4
  #   coderay_bold_every: 10
  #   coderay_css: class


# --------------------------------------------------
#  DISQUS COMMENT SYSTEM
# --------------------------------------------------
#disqus:
#  shortname: lancecai


# include: [".htaccess"]
# exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "minimal-mistakes.sublime-project", "minimal-mistakes.sublime-workspace"]

# --------------------------------------------------
#  INCLUDE / EXCLUDE Lists
# --------------------------------------------------
include: [".htaccess"]           # Files to force-include in the build
exclude:                         # Folders/files ignored during build
  # ↓ 必须排除，否则会让 GitHub Pages 构建失败或页面冲突：
  #   backup/    改版前的备份，里面 publications.md 的 permalink 和正式页面撞车
  #   EDITING.md 编辑指南，里面的 Liquid 示例会被当成真模板解析
  - "backup"
  - "EDITING.md"
  - "lib"
  - "config.rb"
  - "Capfile"
  - "config"
  - "log"
  - "Rakefile"
  - "Rakefile.rb"
  - "tmp"
  - "less"
  - "minimal-mistakes.sublime-project"
  - "minimal-mistakes.sublime-workspace"


# --------------------------------------------------
#  OPTIONAL PLUG-INS (uncomment once gems are added)
# --------------------------------------------------
plugins:
  - jekyll-feed          # Auto-generate RSS feed
  - jekyll-sitemap       # Auto-generate sitemap.xml
  - jekyll-seo-tag       # Adds SEO meta tags & JSON-LD
#   - jekyll-picture-tag   # Responsive images & WebP/AVIF
  # - jekyll-archives      # Year/month archive pages


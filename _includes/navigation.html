<!--
  Top navigation.
  `over` = true  -> starts transparent on top of a full-bleed hero (home page)
  `over` = false -> solid white from the start (interior pages)
  Links come from `links:` in _config.yml
-->
{% assign starts_over = include.over | default: false %}

<header class="site-nav {% if starts_over %}site-nav--over{% else %}site-nav--solid{% endif %}"
        id="site-nav" data-over="{{ starts_over }}">
  <div class="site-nav__inner">
    <a class="site-nav__brand" href="{{ site.url }}/">{{ site.owner.name }}</a>

    <button class="site-nav__burger" id="nav-burger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    {% capture current %}{{ page.url | remove: 'index.html' }}{% endcapture %}
    <nav role="navigation" itemscope itemtype="http://schema.org/SiteNavigationElement">
      <ul class="site-nav__links">
        {% for link in site.links %}
        <li>
          <a href="{{ site.url }}{{ link.url }}"
             class="{% if current == link.url %}is-current{% elsif link.url != '/' and current contains link.url %}is-current{% endif %}">{{ link.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<script>
(function () {
  var nav    = document.getElementById('site-nav');
  var burger = document.getElementById('nav-burger');
  var startsOver = nav.getAttribute('data-over') === 'true';

  function onScroll() {
    if (!startsOver) return;
    var solid = window.scrollY > 60;
    nav.classList.toggle('site-nav--solid', solid);
    nav.classList.toggle('site-nav--over', !solid);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  burger.addEventListener('click', function () {
    var open = nav.classList.toggle('is-open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>

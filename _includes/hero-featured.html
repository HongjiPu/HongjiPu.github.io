<!-- 首页 Featured 区块 — 内容来自 _data/featured.yml -->
{% assign cards = site.data.featured.cards %}
{% if cards.size > 0 %}
<div class="feat" id="feat">
  <div class="feat__stage">
    {% for card in cards %}
    <article class="feat__slide{% if forloop.first %} is-active{% endif %}" data-i="{{ forloop.index0 }}"
             {% unless forloop.first %}aria-hidden="true"{% endunless %}>
      <div class="feat__body">
        {% if card.date %}<time class="feat__date">{{ card.date }}</time>{% endif %}
        <h2 class="feat__title">
          <a href="{{ site.url }}{{ card.url }}">{{ card.title }}<svg class="feat__chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></a>
        </h2>
        {% if card.excerpt %}<p class="feat__excerpt">{{ card.excerpt }}</p>{% endif %}
      </div>
      <div class="feat__media">
        <img src="{{ card.image }}" alt="" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}">
      </div>
    </article>
    {% endfor %}
  </div>

  <nav class="feat__tabs" id="feat-tabs" aria-label="Featured items">
    {% for card in cards %}
    <button class="feat__tab{% if forloop.first %} is-active{% endif %}" data-i="{{ forloop.index0 }}"
            aria-selected="{% if forloop.first %}true{% else %}false{% endif %}">
      <span class="feat__rule"></span>
      <span class="feat__tab-label">{{ card.tab | default: card.title }}</span>
    </button>
    {% endfor %}
  </nav>
</div>

<script>
(function () {
  var root = document.getElementById('feat');
  if (!root) return;
  var slides = root.querySelectorAll('.feat__slide');
  var tabs   = root.querySelectorAll('.feat__tab');
  if (slides.length < 1) return;

  var i = 0, timer = null, DELAY = 7000;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(n) {
    i = (n + slides.length) % slides.length;
    for (var k = 0; k < slides.length; k++) {
      var on = k === i;
      slides[k].classList.toggle('is-active', on);
      if (on) slides[k].removeAttribute('aria-hidden');
      else slides[k].setAttribute('aria-hidden', 'true');
      tabs[k].classList.toggle('is-active', on);
      tabs[k].setAttribute('aria-selected', on ? 'true' : 'false');
    }
  }
  function start() { if (!reduce && !timer && slides.length > 1) timer = setInterval(function () { show(i + 1); }, DELAY); }
  function stop()  { if (timer) { clearInterval(timer); timer = null; } }

  root.querySelector('.feat__tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.feat__tab');
    if (!b) return;
    show(+b.dataset.i); stop(); start();
  });

  // 读内容时不要自动跳走
  root.addEventListener('pointerenter', stop);
  root.addEventListener('pointerleave', start);
  root.addEventListener('focusin', stop);
  root.addEventListener('focusout', start);

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { es[0].isIntersecting ? start() : stop(); },
      { threshold: 0.2 }).observe(root);
  } else start();
})();
</script>
{% endif %}

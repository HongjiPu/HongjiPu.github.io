<script>
// Scroll reveal — fades sections up as they enter the viewport.
(function () {
  var els = document.querySelectorAll('.reveal');
  if (!els.length) return;

  if (!('IntersectionObserver' in window)) {
    Array.prototype.forEach.call(els, function (el) { el.classList.add('is-in'); });
    return;
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-in');
      io.unobserve(entry.target);
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  Array.prototype.forEach.call(els, function (el) { io.observe(el); });
})();
</script>

{% if site.goatcounter %}
<!-- GoatCounter — page views per day at https://{{ site.goatcounter }}.goatcounter.com -->
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
// PDFs (CV, papers) can't run the counter themselves, so count the click as an event.
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href$=".pdf"]');
  if (!a || !window.goatcounter || !window.goatcounter.count) return;
  window.goatcounter.count({
    path: new URL(a.href, location.href).pathname,
    title: 'PDF: ' + (a.textContent || '').trim(),
    event: true
  });
});
</script>
{% endif %}

{% if site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}

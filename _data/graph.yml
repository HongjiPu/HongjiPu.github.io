# ============================================================
#  研究图谱 / Research map
#
#  首页 "Research Interests" 那一块的点状关系图。
#  中心是最大的点，外面两圈按主次排布，点越大 = 越核心（颜色也越深）。
#
#  字段说明：
#    id      唯一标识，links 里靠它互相引用（英文小写，别用空格）
#    label   点旁边显示的文字，尽量短，两三个词最好看
#    weight  1-100，决定点的大小和颜色深浅 —— 这就是"主次"，按你的实际
#            投入自己调。中心点固定 100。
#    orbit   0 = 中心；1 = 内圈（核心方向）；2 = 外圈（具体课题）
#    angle   角度，0 = 正右，逆时针为正。不写就在本圈内自动均分。
#            想微调布局、避免文字打架的时候用它。
#    note    鼠标悬停时显示的一句话说明
#    links   除了自动连中心之外，还要连到哪些点（写对方的 id）
#            内圈默认自动连中心，外圈必须写 links 指明挂在哪个方向下
#
#  改完直接刷新页面就能看到，不需要动任何代码。
# ============================================================

nodes:
  # ---------- 中心 ----------
  - id: agents
    label: "Language Agents"
    weight: 100
    orbit: 0
    note: "构建能记忆、验证、并从经验中自我进化的语言智能体"

  # ---------- 内圈：核心方向 ----------
  - id: selfevolve
    label: "Self-Evolving Agents"
    weight: 90
    orbit: 1
    angle: 90
    note: "从经验、外部知识与可验证反馈中持续改进记忆、技能与决策"
    links: [skills, continual, memory]

  - id: worldmodel
    label: "World Models"
    weight: 88
    orbit: 1
    angle: 30
    note: "用可执行的世界模型预判动作后果，让反馈不再靠猜"
    links: [graphwm, algodesign, memory]

  - id: memory
    label: "Memory & Verification"
    weight: 86
    orbit: 1
    angle: 150
    note: "记忆、信念与证据机制，让智能体行为可复现、可审计"
    links: [counterfactual, rag]

  - id: trust
    label: "Trustworthy LLM Systems"
    weight: 76
    orbit: 1
    angle: 198
    note: "改进失败样本的同时，不破坏原本正确的判断"
    links: [rubric, provenance]

  - id: rl
    label: "Reinforcement Learning"
    weight: 70
    orbit: 1
    angle: 330
    note: "不确定环境下的序贯决策与策略选择"
    links: [routing, counterfactual]

  - id: quant
    label: "Quantitative Finance"
    weight: 62
    orbit: 1
    angle: 266
    note: "波动率建模、风险度量与状态识别"
    links: [volatility]

  # ---------- 外圈：具体课题 ----------
  - id: graphwm
    label: "Graph World Models"
    weight: 54
    orbit: 2
    angle: 10
    note: "Network World Models — 带干预语义的图上扩散动力学建模"
    links: [worldmodel]

  - id: algodesign
    label: "Algorithm Discovery"
    weight: 46
    orbit: 2
    angle: 45
    note: "把世界模型当作环境，驱动 LLM 自动设计并筛选算法"
    links: [worldmodel, selfevolve]

  - id: skills
    label: "Skill Libraries"
    weight: 48
    orbit: 2
    angle: 72
    note: "SkillOps — 把智能体技能库当作自维护的软件生态来运维"
    links: [selfevolve]

  - id: continual
    label: "Continual Learning"
    weight: 42
    orbit: 2
    angle: 112
    note: "Paper2LLM++ — 让模型从研究论文中持续吸收新方法"
    links: [selfevolve]

  - id: counterfactual
    label: "Counterfactual Memory"
    weight: 56
    orbit: 2
    angle: 140
    note: "CounterMem — 为失败动作生成替代方案，经世界模型验证后入库复用"
    links: [memory, worldmodel]

  - id: rag
    label: "Adaptive RAG"
    weight: 44
    orbit: 2
    angle: 168
    note: "BeliefRAG — 证据演化时让检索增强保持显式的信念状态"
    links: [memory]

  - id: provenance
    label: "Code-Agent Provenance"
    weight: 36
    orbit: 2
    angle: 192
    note: "Launder-Bench — 仓库级别的智能体代码洗稿能否被检测出来"
    links: [trust]

  - id: rubric
    label: "Rubric Optimization"
    weight: 40
    orbit: 2
    angle: 218
    note: "RubricWorld / RubricGuard — 以评分边界为单位修补量表，并审计回归"
    links: [trust]

  - id: volatility
    label: "Volatility Control"
    weight: 42
    orbit: 2
    angle: 290
    note: "Beyond Forecasting — 把波动率控制重构成一个路由问题"
    links: [quant, routing]

  - id: routing
    label: "LLM Routing"
    weight: 50
    orbit: 2
    angle: 332
    note: "RouteProfile — 用图结构画像解决冷启动场景下的模型路由"
    links: [rl, selfevolve]

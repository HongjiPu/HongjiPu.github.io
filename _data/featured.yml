# ============================================================
#  首页 Featured 区块（位于姓名与定位下方）
#
#  样式：左边白底文字（日期 / 标题 / 摘要），右边配图，
#        下方一排标签可以切换，也会每 7 秒自动轮换。
#
#  每一条：
#    date     左上角的小字日期
#    title    大标题。会自动带一个蓝色 › 箭头
#    excerpt  标题下面那段摘要，两到四行最好看
#    url      点标题跳转到哪里
#    image    右侧配图。放进 images/featured/ 目录后写路径即可。
#             建议横图，宽度 1200-1600px；卡片高度固定，图片会自动裁切
#    tab      下方标签栏显示的短标题；不写就用 title
#
#  想加/删卡片，直接增删下面的块，标签栏会自动跟着变。
# ============================================================

cards:
  - date: "October 2026"
    title: "A world model turns algorithm design into a search you can actually run"
    excerpt: >
      Learn an action-conditioned model of how a network responds to
      intervention, and candidate algorithms can be judged without calling a
      trusted simulator — 1.01% regret from the world model alone, against
      1.13% from simulator-based selection.
    url: /research/foundations/
    image: /images/featured/worldmodel.svg
    tab: "Network world models"

  - date: "September 2026"
    title: "Agent memory is only worth keeping if its claims have been checked"
    excerpt: >
      CounterMem generates alternatives to the actions an agent got wrong,
      verifies their outcomes against executable world models, and stores the
      contrast with its evidence. Verified counterfactuals improved ReAct and
      Reflexion in 24 of 24 comparisons.
    url: /research/foundations/
    image: /images/featured/memory.svg
    tab: "Verified memory"

  - date: "May 2026"
    title: "The next bottleneck in agentic AI isn't capability — it's maintenance"
    excerpt: >
      As agents accumulate skills, the fragile part shifts from what they can do
      to what they can keep. Treating the skill library as a self-maintaining
      software ecosystem — versioned, evaluated, repaired — is what stops
      capability from quietly decaying.
    url: /research/foundations/
    image: /images/featured/skills-placeholder.jpg
    tab: "The maintenance bottleneck"

  - date: "August 2026"
    title: "Volatility control is a routing problem, not a forecasting problem"
    excerpt: >
      Stop asking which estimator is best and start asking which one to trust
      right now. Routing between estimators by regime beat naive scaling on both
      Sharpe and drawdown in S&P 500 futures backtests.
    url: /research/applications/
    image: /images/featured/routing.svg
    tab: "Volatility as routing"

  - date: "Research"
    title: "Two pillars: trustworthy machinery, and real stakes"
    excerpt: >
      One line builds the underlying machinery — memory, verification,
      self-evolution, world models. The other puts it where being wrong is
      expensive: capital markets and classrooms. Each keeps the other honest.
    url: /research/
    image: /images/featured/pillars.svg
    tab: "Two research pillars"

# ============================================================
#  Publications / 出版物栏
#
#  categories : 筛选按钮，按这里的顺序显示。
#               每篇论文的 `category` 必须是这里的一个。
#
#  items      : 一篇论文一块。字段 —
#    title             必填，论文标题
#    authors           必填，列表；名字命中 highlight_authors 会自动加粗
#                      共同一作直接在名字后面写 †，通讯作者写 ~
#                      （加粗匹配会自动忽略这些符号，不影响你的名字变粗）
#    venue             必填，如 "arXiv:2605.00180, 2026" / "NeurIPS, 2026"
#    year              必填，整数，用于排序和 "show all by date"
#    month             可选，1-12，同一年内再排序
#    category          必填，主方向，必须是 categories 里的一个
#    extra_categories  可选，同时归到别的方向下
#    selected          可选，true 表示出现在默认的 "show selected" 视图
#    links             可选，{name, url} 列表。第一个链接会挂在标题上。
#                      name 用 Paper / Code / Demo / Slides，各有自己的图标。
#
#  加论文：复制一块改内容即可。文件里的先后顺序无所谓，页面按 year/month 排。
# ============================================================

# 你的名字在作者列表里的各种写法，命中任意一个就加粗

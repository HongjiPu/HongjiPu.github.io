# ============================================================
#  Publications / 出版物栏
#
#  categories : the research-direction filter chips, in display order.
#               A paper's `category` MUST be one of these strings.
#
#  items      : one block per paper. Fields —
#    title            (required) paper title
#    authors          (required) list; your own name is auto-bolded
#                     (matching is set by `highlight_author` below)
#    venue            (required) e.g. "NeurIPS, 2026" / "Working Paper, 2025"
#    year             (required) integer, used for sorting + "by date" view
#    month            (optional) 1-12, refines ordering inside a year
#    category         (required) primary direction — must match `categories`
#    extra_categories (optional) also show under these directions
#    selected         (optional) true -> appears in the default "selected" view
#    links            (optional) list of {name, url}. First link is used for
#                     the title hyperlink. name "Code"/"Demo" get their own icon.
#
#  To add a paper: copy a block and edit it. Order in this file does not
#  matter — sorting is done by year/month.
# ============================================================

highlight_author: "Hongji Pu"

categories:
  - Reinforcement Learning
  - Multi-Agent AI
  - Time Series & Volatility
  - FinTech & Market Microstructure
  - Working Papers

